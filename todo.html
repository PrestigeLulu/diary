
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다이어리 - 할 일</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/todo.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="sidebar-brand" href="./index.html">
        <span class="brand-icon">
          <img src="./assets/images/book-open.svg" alt="">
        </span>
        <span class="brand-name">다이어리</span>
      </a>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="./index.html">
          <img class="sidebar-icon" src="./assets/images/calendar.svg" alt="">
          <span>캘린더</span>
        </a>
        <a class="sidebar-link" href="./schedule.html">
          <img class="sidebar-icon" src="./assets/images/calendar.svg" alt="">
          <span>일정</span>
        </a>
        <a class="sidebar-link is-active" href="./todo.html">
          <img class="sidebar-icon" src="./assets/images/check-circle.svg" alt="">
          <span>할 일</span>
        </a>
        <a class="sidebar-link" href="./settings.html">
          <img class="sidebar-icon" src="./assets/images/settings.svg" alt="">
          <span>설정</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <span class="profile-avatar"></span>
        <div>
          <strong id="my-name"></strong>
          <span id="my-stuid"></span>
        </div>
      </div>
    </aside>

    <main class="todo-page">
      <header class="todo-header">
        <div>
          <h1>나의 체크리스트</h1>
          <p>작은 계획을 하나씩 완료하며 오늘을 가볍게 정리해요.</p>
        </div>
        <button class="add-button" id="add-todo" type="button">
          ＋ 새 할 일
        </button>
      </header>

      <div class="todo-stats">
        <div class="stat is-active" onclick="filterView('all', this)">
          <span>전체</span>
          <strong id="total-count">0</strong>
        </div>

        <div class="stat" onclick="filterView('incomplete', this)">
          <span>미완료</span>
          <strong id="active-count">0</strong>
        </div>

        <div class="stat" onclick="filterView('completed', this)">
          <span>완료</span>
          <strong id="completed-count">0</strong>
        </div>

        <p id="today-count">오늘 0개 완료</p>
      </div>

      <section class="todo-section">
        <h2>해야 할 일 <span id="active-title-count">0</span></h2>
        <ul class="todo-list" id="active-list"></ul>
      </section>

      <section class="todo-section">
        <h2>완료한 일</h2>
        <ul class="todo-list" id="completed-list"></ul>
      </section>
    </main>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/todo.js"></script>
</body>
</html>
