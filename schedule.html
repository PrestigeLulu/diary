<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary - Schedule</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/schedule.css">
</head>
<body>
  <div class="app-layout"; style="position: absolute;">
      <!-- 왼쪽 사이드바 전체 영역 좌측 고정 -->
      <aside class="sidebar" aria-label="주요 메뉴">
        <!-- 로고 / 서비스 이름 로고 클릭시 index.html로 이동-->
        <a class="sidebar-brand" href="./index.html" aria-label="홈">
          <span class="brand-icon">
            <img src="./assets/images/book-open.svg" alt="" />
          </span>
          <span class="brand-name">다이어리</span>
        </a>

        <!-- 페이지 이동 메뉴 -->
        <nav class="sidebar-nav" aria-label="페이지 이동">
          <!-- 현재 페이지: 캘린더 -->
          <a
            class="sidebar-link"
            href="./index.html"
            aria-current="page"
          >
            <img
              class="sidebar-icon"
              src="./assets/images/calendar.svg"
              alt=""
            />
            <span>캘린더</span>
          </a>

          <!-- 일정 페이지로 이동 -->
          <a class="sidebar-link is-active" 
            href="./schedule.html"
          >
            <img
              class="sidebar-icon"
              src="./assets/images/calendar.svg"
              alt=""
            />
            <span>일정</span>
          </a>

          <!-- 할 일 페이지로 이동 -->
          <a class="sidebar-link" href="./todo.html">
            <img
              class="sidebar-icon"
              src="./assets/images/check-circle.svg"
              alt=""
            />
            <span>할 일</span>
          </a>

          <!-- 설정 페이지로 이동 -->
          <a class="sidebar-link" href="./settings.html">
            <img
              class="sidebar-icon"
              src="./assets/images/settings.svg"
              alt=""
            />
            <span>설정</span>
          </a>
        </nav>

        <!-- 사용자 프로필 영역 -->
        <div class="sidebar-profile">
          <span class="profile-avatar" aria-hidden="true"></span>
          <div>
            <strong>성명</strong>
            <span>학번</span>
          </div>
        </div>
      </aside>

      <!-- 오른쪽 캘린더 페이지 본문 영역 -->
      <main class="page-content" aria-label="캘린더 페이지"></main>
    </div>
  <script src="./js/schedule.js"></script>

  <div class="schedule-main">
    <h1>일정</h1>
    <p style="color: gray; position: absolute; top: 50px;">다가오는 약속과 계획을 한눈에 정리해요.</p>
  </div>
  
  <div class="schedule-box1">
    <img
      class="box-icon"
      src="./assets/images/calendar.svg"
    />
    <p style="bottom: 3px; left: 10px; color: gray;">날짜</p>
    <p>2026년 9월</p>
  </div>

  <div class="schedule-box2">
    <img
      class="box-icon"
      src="./assets/images/tag.svg"
    />
    <p style="bottom: 3px; left: 10px; color: gray;">카테고리</p>
    <p>전체</p>
  </div>

  <div class="schedule-add">
    <img
      class="box-icon"
      src="./assets/images/circle-plus.svg"
    />
    <p>일정 추가</p>
  </div>

  <div class="schedule-list">
    <p>-------------------------------</p>
    <div class="schedule-list-box">
      <p>sfdsfsdfsf</p>
    </div>
  </div>
</body>
</html>
