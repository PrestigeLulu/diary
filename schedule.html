<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary - Schedule</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/schedule.css">
  <script src="./js/theme.js"></script>
</head>
<body>
  <div class="app-layout"; style="position: absolute;">
      <!-- 왼쪽 사이드바 전체 영역 좌측 고정 -->
      <aside class="sidebar">
      <a class="sidebar-brand" href="./index.html">
        <span class="brand-icon">
          <img src="./assets/images/book-open.svg" alt="">
        </span>
        <span class="brand-name">다이어리</span>
      </a>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="./index.html">
          <img class="sidebar-icon" src="./assets/images/calendar.svg" alt="">
          <span>캘린더</span>
        </a>
        <a class="sidebar-link is-active" href="./schedule.html">
          <img class="sidebar-icon" src="./assets/images/calendar.svg" alt="">
          <span>일정</span>
        </a>
        <a class="sidebar-link" href="./todo.html">
          <img class="sidebar-icon" src="./assets/images/check-circle.svg" alt="">
          <span>할 일</span>
        </a>
        <a class="sidebar-link" href="./settings.html">
          <img class="sidebar-icon" src="./assets/images/settings.svg" alt="">
          <span>설정</span>
        </a>
      </nav>
      <div class="sidebar-profile">
        <span class="profile-avatar"></span>
        <div>
          <strong id="my-name"></strong>
          <span id="my-stuid"></span>
        </div>
      </div>
    </aside>

      <!-- 오른쪽 캘린더 페이지 본문 영역 -->
    <main class="page-content" aria-label="캘린더 페이지"></main>
  </div>

  <!-- 사이드바 오른쪽 본문 영역 -->
  <div class="schedulePage">

    <!-- 제목 + 일정 추가 버튼 -->
    <div class="scheduleHeader">
      <div class="scheduleTitle">
        <h1>일정</h1>
        <p>다가오는 약속과 계획을 한눈에 정리해요.</p>
      </div>
      <button class="scheduleAdd" type="button">
        <img class="box-icon" src="./assets/images/circle-plus.svg" alt="" />
        일정 추가
      </button>
    </div>

    <!-- 필터 -->
    <div class="scheduleFilters">
      <div class="filterBox" id="dateFilter">
        <img class="sidebar-icon" src="./assets/images/calendar.svg" alt="" />
        <span class="filterLabel">날짜</span>
        <span class="filterValue">전체</span>
        <span class="filterArrow"></span>
        <ul class="filterList"></ul>
      </div>

      <div class="filterBox" id="categoryFilter">
        <img class="sidebar-icon" src="./assets/images/tag.svg" alt="" />
        <span class="filterLabel">카테고리</span>
        <span class="filterValue">전체</span>
        <span class="filterArrow"></span>
        <ul class="filterList"></ul>
      </div>

      <span class="scheduleCount">총 0개의 일정</span>
    </div>

    <!-- 일정 카드 -->
    <div class="scheduleList">
      <div class="scheduleListHead">
        <span>9월의 일정</span>
        <span class="scheduleListSort">날짜순</span>
      </div>

      <!-- JS가 일정 행을 여기에 채움 -->
      <div class="scheduleRows"></div>
    </div>

  </div>

  <!-- 순서 중요 -->
  <script src="./js/storage.js"></script>
  <script src="./js/schedule.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
