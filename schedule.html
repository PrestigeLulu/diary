<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary - Schedule</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/schedule.css">
</head>
<body>
  <div class="app-layout"; style="position: absolute;">
      <!-- 왼쪽 사이드바 전체 영역 좌측 고정 -->
      <aside class="sidebar" aria-label="주요 메뉴">
        <!-- 로고 / 서비스 이름 로고 클릭시 index.html로 이동-->
        <a class="sidebar-brand" href="./index.html" aria-label="홈">
          <span class="brand-icon">
            <img src="./assets/images/book-open.svg" alt="" />
          </span>
          <span class="brand-name">다이어리</span>
        </a>

        <!-- 페이지 이동 메뉴 -->
        <nav class="sidebar-nav" aria-label="페이지 이동">
          <!-- 현재 페이지: 캘린더 -->
          <a
            class="sidebar-link"
            href="./index.html"
            aria-current="page"
          >
            <img
              class="sidebar-icon"
              src="./assets/images/calendar.svg"
              alt=""
            />
            <span>캘린더</span>
          </a>

          <!-- 일정 페이지로 이동 -->
          <a class="sidebar-link is-active" 
            href="./schedule.html"
          >
            <img
              class="sidebar-icon"
              src="./assets/images/calendar.svg"
              alt=""
            />
            <span>일정</span>
          </a>

          <!-- 할 일 페이지로 이동 -->
          <a class="sidebar-link" href="./todo.html">
            <img
              class="sidebar-icon"
              src="./assets/images/check-circle.svg"
              alt=""
            />
            <span>할 일</span>
          </a>

          <!-- 설정 페이지로 이동 -->
          <a class="sidebar-link" href="./settings.html">
            <img
              class="sidebar-icon"
              src="./assets/images/settings.svg"
              alt=""
            />
            <span>설정</span>
          </a>
        </nav>

        <!-- 사용자 프로필 영역 -->
        <div class="sidebar-profile">
          <span class="profile-avatar" aria-hidden="true"></span>
          <div>
            <strong>성명</strong>
            <span>학번</span>
          </div>
        </div>
      </aside>

      <!-- 오른쪽 캘린더 페이지 본문 영역 -->
      <main class="page-content" aria-label="캘린더 페이지"></main>
  </div>
  <script src="./js/schedule.js"></script>

  <!-- 사이드바 오른쪽 본문 영역 -->
  <div class="schedulePage">

    <!-- 제목 + 일정 추가 버튼 -->
    <div class="scheduleHeader">
      <div class="scheduleTitle">
        <h1>일정</h1>
        <p>다가오는 약속과 계획을 한눈에 정리해요.</p>
      </div>
      <button class="scheduleAdd" type="button">
        <img class="box-icon" src="./assets/images/circle-plus.svg" alt="" />
        일정 추가
      </button>
    </div>

    <!-- 필터 -->
    <div class="scheduleFilters">
      <div class="filterBox">
        <img class="box-icon" src="./assets/images/calendar.svg" alt="" />
        <span class="filterLabel">날짜</span>
        <span class="filterValue">2026년 9월</span>
      </div>

      <div class="filterBox">
        <img class="box-icon" src="./assets/images/tag.svg" alt="" />
        <span class="filterLabel">카테고리</span>
        <span class="filterValue">전체</span>
      </div>
    </div>

    <!-- 일정 카드 -->
    <div class="scheduleList">
      <p class="scheduleListHead">9월의 일정</p>
      <p style='right'>날짜순</p>

      <div class="scheduleListBox">
        <div class="dateBox">
          <strong>09</strong>
          <span>9월 · 수요일</span>
        </div>

        <div class="line"></div>

        <div class="timeBox">
          <strong>09:00</strong>
          <span>1시간</span>
        </div>

        <span class="category-dot green"></span>

        <div class="scheduleInfo">
          <h2>주간 팀 미팅</h2>
          <p>이번 주 진행 상황과 다음 스프린트 계획 정리</p>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
